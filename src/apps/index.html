<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Showcase</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Anti-flash: aplica o tema salvo antes do primeiro paint (mesma chave e regra do ThemeService).
    (function () {
      try {
        var mode = localStorage.getItem('shy-theme');
        if (mode !== 'light' && mode !== 'system') mode = 'dark';
        var light = mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme-mode', mode);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
