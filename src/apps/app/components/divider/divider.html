<div class="page">
  <h1 class="page-title">Divider</h1>
  <p class="page-lead"><code>&lt;shy-divider&gt;</code> is a <code>role="separator"</code>; the vertical one adds <code>aria-orientation="vertical"</code>. The optional text (horizontal only) is visual: do not put essential information in it.</p>

  <section class="section">
    <h2>Horizontal</h2>
    <div class="card shy-stack">
      <span>Above</span>
      <shy-divider />
      <span>Below</span>
      <shy-divider>or</shy-divider>
      <span>With text</span>
    </div>
  </section>

  <section class="section">
    <h2>Vertical</h2>
    <div class="card row">
      <span>Docs</span>
      <shy-divider orientation="vertical" />
      <span>Changelog</span>
      <shy-divider orientation="vertical" />
      <span>Support</span>
    </div>
  </section>
</div>
