<div class="group" role="radiogroup" [attr.aria-label]="labels().group" (keydown)="onKeydown($event)">
  @for (option of options(); track option.value) {
    <button type="button" class="option" role="radio" [attr.data-mode]="option.value" [attr.aria-checked]="mode() === option.value" [tabindex]="mode() === option.value ? 0 : -1" (click)="select(option.value)">
      {{ option.label }}
    </button>
  }
</div>
