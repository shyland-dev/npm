<span class="start"
  ><ng-content select="[slot=start]" />
  @if (spinnerAt() === 'start') {
    <span class="spinner" aria-hidden="true"></span>
  }</span
><span class="label"
  ><span class="text" [class.is-hidden]="swapText()"><ng-content /></span>
  @if (loadingText() && loadingPosition() !== 'replace') {
    <span class="loading-text" [class.is-hidden]="!swapText()" [attr.aria-hidden]="swapText() ? null : 'true'">{{ loadingText() }}</span>
  }</span
><span class="end"
  ><ng-content select="[slot=end]" />
  @if (spinnerAt() === 'end') {
    <span class="spinner" aria-hidden="true"></span>
  }
</span>
@if (spinnerAt() === 'replace') {
  <span class="overlay" aria-hidden="true"><span class="spinner"></span></span>
}
