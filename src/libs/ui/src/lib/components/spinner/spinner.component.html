<span class="graphic" aria-hidden="true">
  @switch (variant()) {
    @case ('dots') {
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    }
    @case ('bars') {
      <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    }
    @case ('pulse') {
      <span class="ping"></span><span class="ping"></span>
    }
    @case ('orbit') {
      <span class="orbit"><span class="satellite"></span></span>
    }
    @case ('breathe') {
      <span class="core"></span>
    }
    @default {
      <svg class="ring" [class.dash]="variant() === 'dash'" viewBox="0 0 24 24" focusable="false">
        @if (variant() === 'ring-track') {
          <circle class="track" cx="12" cy="12" r="10" stroke-width="2.5" />
        }
        <circle class="arc" cx="12" cy="12" r="10" stroke-width="2.5" pathLength="100" />
      </svg>
    }
  }
</span>
@if (label()) {
  <span class="label">{{ label() }}</span>
}
