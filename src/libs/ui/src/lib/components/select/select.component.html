<button #trigger class="select__trigger" type="button" role="combobox" [id]="id()" [disabled]="isDisabled()" aria-haspopup="listbox" [attr.aria-expanded]="isOpen()" [attr.aria-controls]="isOpen() ? listId() : null" [attr.aria-activedescendant]="activeId()" [attr.aria-label]="label() ?? null" [attr.aria-required]="required() ? 'true' : null" [attr.aria-invalid]="showInvalid() ? 'true' : null" [attr.aria-describedby]="field?.describedBy() ?? null" [attr.aria-errormessage]="showInvalid() ? (field?.errorId() ?? null) : null" (click)="toggleOpen()" (keydown)="onKeydown($event)" (keyup)="onKeyup($event)" (blur)="onBlur()">
  @if (firstImg(); as img) {
    <span class="select__img"><img [src]="img" alt="" /></span>
  }
  <span class="select__label" [attr.data-placeholder]="display() ? null : ''">
    @if (display()) {
      {{ display() }}
    } @else if (placeholder()) {
      {{ placeholder() }}
    } @else {
      <ng-content />
    }
  </span>

  <shy-icon class="select__dropdown-icon" [class.select__dropdown-icon--open]="isOpen()">{{ dropdownIcon() }}</shy-icon>
</button>

<ng-template #panel>
  <!-- O foco fica no botão: o mousedown não pode tirá-lo dele. -->
  <ul class="select__dropdown" role="listbox" [id]="listId()" [attr.aria-multiselectable]="multiple() ? 'true' : null" [attr.aria-labelledby]="field?.labelId() ?? null" [attr.aria-label]="field?.labelId() ? null : (label() ?? null)" (mousedown)="$event.preventDefault()">
    @for (option of items(); track $index) {
      <li class="select__option" role="option" [id]="optionId($index)" [class.select__option--active]="activeIndex() === $index" [attr.aria-selected]="isSelectedValue(option.value)" [attr.aria-disabled]="option.disabled ? 'true' : null" (click)="choose($index)" (pointermove)="option.disabled || activeIndex() === $index ? null : activeIndex.set($index)">
        <span class="select__option-icon">
          @if (isSelectedValue(option.value)) {
            <shy-icon>{{ selectIcon() }}</shy-icon>
          }
        </span>

        @if (option.img) {
          <span class="select__option-img">
            <img [src]="option.img" alt="" />
          </span>
        }

        <span class="select__option-label">{{ option.label }}</span>
      </li>
    }
  </ul>
</ng-template>
