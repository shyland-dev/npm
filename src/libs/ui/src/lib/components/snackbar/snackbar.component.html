<div class="snackbar" role="status" aria-live="polite" aria-atomic="true" [class.snackbar--top]="position() === 'top'" [class.snackbar--bottom]="position() === 'bottom'" [class.snackbar--visible]="visible()">
  <span class="snackbar__text">
    @if (text()) {
      {{ text() }}
    } @else {
      <ng-content />
    }
  </span>

  <button class="snackbar__dismiss" type="button" aria-label="Dismiss" [tabindex]="visible() ? 0 : -1" (click)="dismiss()">
    <shy-icon>x</shy-icon>
  </button>
</div>
