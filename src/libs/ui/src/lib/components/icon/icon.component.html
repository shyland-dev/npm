<span #projected class="icon-name"><ng-content /></span>
<span class="icon-wrapper" [style.--shy-icon-hover-delay]="hoverFillDelay() + 'ms'">
  <span class="icon-layer" [style.opacity]="hovered() && svgFill() ? 0 : 1" [innerHTML]="svg()"></span>
  @if (svgFill(); as fill) {
    <span class="icon-layer" [style.opacity]="hovered() ? 1 : 0" [innerHTML]="fill"></span>
  }
</span>
