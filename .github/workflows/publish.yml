name: Publish Libs

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@shyland-dev'

      - name: Instalar dependências
        run: npm ci

      - name: Build das libs
        run: npm run build

      - name: Publicar @shyland-dev/ui no npm
        if: github.event_name == 'push'
        run: |
          PKG_NAME=$(node -p "require('./src/ui/dist/ui/package.json').name")
          PKG_VERSION=$(node -p "require('./src/ui/dist/ui/package.json').version")
          if npm show "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "Versão $PKG_VERSION de $PKG_NAME já publicada, pulando."
          else
            if [[ "$PKG_VERSION" == *"-"* ]]; then
              PRE_TAG=$(echo "$PKG_VERSION" | sed 's/.*-\([^.]*\).*/\1/')
              echo "Publicando $PKG_NAME@$PKG_VERSION como pre-release com tag: $PRE_TAG"
              npm publish src/ui/dist/ui --access public --tag "$PRE_TAG"
            else
              echo "Publicando $PKG_NAME@$PKG_VERSION como latest"
              npm publish src/ui/dist/ui --access public
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar @shyland-dev/utils no npm
        if: github.event_name == 'push'
        run: |
          PKG_NAME=$(node -p "require('./src/utils/dist/utils/package.json').name")
          PKG_VERSION=$(node -p "require('./src/utils/dist/utils/package.json').version")
          if npm show "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "Versão $PKG_VERSION de $PKG_NAME já publicada, pulando."
          else
            if [[ "$PKG_VERSION" == *"-"* ]]; then
              PRE_TAG=$(echo "$PKG_VERSION" | sed 's/.*-\([^.]*\).*/\1/')
              echo "Publicando $PKG_NAME@$PKG_VERSION como pre-release com tag: $PRE_TAG"
              npm publish src/utils/dist/utils --access public --tag "$PRE_TAG"
            else
              echo "Publicando $PKG_NAME@$PKG_VERSION como latest"
              npm publish src/utils/dist/utils --access public
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
