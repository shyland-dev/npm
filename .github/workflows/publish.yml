name: Publish Libs

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependências
        run: npm ci

      - name: Build das libs
        run: npm run build

      - name: Publicar pacotes no npm
        if: github.event_name == 'push'
        run: |
          for PKG_DIR in src/ui/dist/ui src/utils/dist/utils; do
            PKG_NAME=$(node -p "require('./$PKG_DIR/package.json').name")
            PKG_VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
            if npm show "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
              echo "Versão $PKG_VERSION de $PKG_NAME já publicada, pulando."
            else
              if [[ "$PKG_VERSION" == *"-"* ]]; then
                PRE_TAG=$(echo "$PKG_VERSION" | sed 's/.*-\([^.]*\).*/\1/')
                echo "Publicando $PKG_NAME@$PKG_VERSION como pre-release com tag: $PRE_TAG"
                npm publish "$PKG_DIR" --provenance --tag "$PRE_TAG"
              else
                echo "Publicando $PKG_NAME@$PKG_VERSION como latest"
                npm publish "$PKG_DIR" --provenance
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
